version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: escuela-musica-db
    environment:
      POSTGRES_USER: escuela
      POSTGRES_PASSWORD: escuela123
      POSTGRES_DB: escuela_musica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escuela -d escuela_musica"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
